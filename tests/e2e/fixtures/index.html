<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>faable auth-js e2e fixture</title>
    <script src="/pkg/dist/faableauth.js"></script>
  </head>
  <body>
    <main id="root">e2e fixture</main>
    <script>
      // Helpers exposed to Playwright via window for orchestrating each test.
      // The library is global: window.FaableAuth = { createClient, ... }.
      window.__faable = {
        createClient(config = {}) {
          window.__client = FaableAuth.createClient({
            domain: window.location.origin,
            clientId: 'test-client',
            redirectUri: window.location.origin + '/',
            debug: false,
            ...config
          })
          return true
        },
        async getSession() {
          const { data } = await window.__client.getSession()
          return data?.session ?? null
        },
        async signInWithOtp(payload) {
          return window.__client.signInWithOtp(payload)
        },
        async signInWithPasswordless(payload) {
          return window.__client.signInWithPasswordless(payload)
        },
        async linkOauthConnection(payload) {
          // skipBrowserRedirect keeps the page here so the test can read the
          // /authorize URL the SDK would have navigated to.
          const { data, error } = await window.__client.linkOauthConnection({
            skipBrowserRedirect: true,
            ...payload
          })
          return { url: data?.url ?? null, error: error ? error.message : null }
        },
        async signOut() {
          return window.__client.signOut({ scope: 'local' })
        },
        async getLastUsedLoginMethod() {
          return window.__client.getLastUsedLoginMethod()
        },
        async refreshSession() {
          return window.__client.refreshSession()
        },
        async handleRedirectCallback() {
          const r = await window.__client.handleRedirectCallback()
          // Flattened here on purpose: Playwright serializes an Error across
          // the evaluate boundary down to name/message and drops `status`.
          return {
            hasSession: !!r?.data?.session,
            error: r?.error
              ? {
                  name: r.error.name,
                  message: r.error.message,
                  status: r.error.status
                }
              : null
          }
        },
        events: [],
        subscribeEvents() {
          const { data } = window.__client.onAuthStateChange(
            (event, session) => {
              window.__faable.events.push({ event, hasSession: !!session })
            }
          )
          window.__subscription = data.subscription
        }
      }
    </script>
  </body>
</html>
