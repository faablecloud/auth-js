<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FaableAuth Login Callback demo</title>
  </head>
  <body>
    <div>
      <h2>Authorize</h2>
      <button id="login">Log in (username-password)</button>
      <button id="authorize">Log in (Hosted Pages)</button>
      <button id="authorize-google">Log in with Google</button>
      <button id="authorize-github">Log in with Github</button>
    </div>
    <div>
      <h2>Other actions</h2>
      <button id="change-password">Change Password</button>
      <button id="build-authorize">Build Authorize URL</button>
      <button id="refresh-session">Refresh Session</button>
      <button id="logout">Log out</button>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-cookie/latest/js.cookie.min.js"></script>
    <script src="/pkg/dist/faableauth.js"></script>
    <script type="module"></script>

    <script type="module">
      import consola from "https://cdn.jsdelivr.net/npm/consola@3.4.2/+esm";

      const loginButton = document.getElementById("login");
      const authButton = document.getElementById("authorize");
      const logoutButton = document.getElementById("logout");

      window.options = {
        domain: "localhost:4500",
        clientId: "e1d88e8c-72a1-4d25-9123-96bb0fe208ee",

        //domain: "faable.auth.faable.link",
        //clientId: "a6f1381a-2591-4f18-aaa4-b8922ac91fce",

        redirect_uri: `${window.origin}/examples/login_username_password.html`,
        response_type: "id_token",
        debug: true,
      };

      var passwordlessEmail;

      authButton.addEventListener("click", () => {
        const webAuth = faableauth.createClient(options);

        webAuth.authorize({
          responseType: "id_token",
        });
      });

      document
        .getElementById("authorize-google")
        .addEventListener("click", () => {
          const webAuth = faableauth.createClient(options);

          webAuth.signInWithOauthConnection({
            connection: "connection_682c4b7a12dd9da09db8fecb",
          });
        });
      document
        .getElementById("authorize-github")
        .addEventListener("click", () => {
          const webAuth = faableauth.createClient(options);

          webAuth.signInWithOauthConnection({
            connection: "connection_6838915f685b297aaae4ab59",
          });
        });

      document
        .getElementById("change-password")
        .addEventListener("click", () => {
          const webAuth = faableauth.createClient(options);

          webAuth.changePassword({ email: "marc@faable.com" });
        });

      document
        .getElementById("refresh-session")
        .addEventListener("click", async () => {
          const webAuth = faableauth.createClient(options);
          const url = await webAuth.refreshSession();
          consola.info(url);
        });

      document
        .getElementById("build-authorize")
        .addEventListener("click", () => {
          const webAuth = faableauth.createClient(options);
          const url = webAuth.buildAuthorizeUrl();
          consola.info(url);
        });

      loginButton.addEventListener("click", () => {
        const auth = faableauth.createClient(options);
        auth.signInWithUsernamePassword({
          username: "marc@faable.com",
          password: "1234567",
        });
        // const webAuth = new auth0.WebAuth(options);

        // webAuth.login(
        //   {
        //     responseType: 'id_token',
        //     username: 'johnfoo@gmail.com',
        //     password: '1234',
        //     realm: 'acme',
        //     onRedirecting: function(done) {
        //       console.log('On redirecting..');
        //       done();
        //     }
        //   },
        //   function(err) {
        //     console.error(err);
        //   }
        // );
      });

      logoutButton.addEventListener("click", () => {
        const webAuth = faableauth.createClient(options);
        webAuth.signOut({
          returnTo: `${window.location.origin}/examples/login_username_password.html`,
        });
      });

      window.onload = function () {
        const webAuth = faableauth.createClient(options);
        webAuth.initialize();
        // const webAuth = new auth0.WebAuth(options);
        // webAuth.parseHash((err, data) => {
        //   console.log(data);
        //   window.location.hash = '';
        // });
      };
    </script>
  </body>
</html>
